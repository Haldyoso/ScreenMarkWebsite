<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
<title>BRK-4417-02 Guide Bracket</title>
<defs>
  <style>
    text{font-family:"Arial Narrow","Liberation Sans Narrow",Arial,sans-serif;fill:#1A1A1A}
    .wide{fill:none;stroke:#1A1A1A;stroke-width:2;stroke-linecap:butt}
    .narrow{fill:none;stroke:#1A1A1A;stroke-width:1;stroke-linecap:butt}
    .ctr{fill:none;stroke:#1A1A1A;stroke-width:1;stroke-dasharray:24 4 4 4}
    .dim{fill:none;stroke:#1A1A1A;stroke-width:1;marker-start:url(#ar);marker-end:url(#ar)}
    .lead{fill:none;stroke:#1A1A1A;stroke-width:1;marker-start:url(#ar)}
    .t{font-size:15px}
    .ts{font-size:13px}
    .lbl{font-size:11px;fill:#5A5A5A;letter-spacing:.5px}
    .big{font-size:19px;font-weight:bold}
    .vw{font-size:17px;letter-spacing:1px}
    .gd{font-size:15px}
  </style>
  <marker id="ar" viewBox="0 0 18 5" refX="18" refY="2.5" markerWidth="18" markerHeight="5"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path d="M0 0 L18 2.5 L0 5 Z" fill="#1A1A1A"/>
  </marker>
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="13" height="13" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="13" stroke="#1A1A1A" stroke-width="1"/>
  </pattern>
</defs>

