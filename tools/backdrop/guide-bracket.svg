<!-- ============================== NOTES ============================== -->
<g>
  <text class="t" x="1180" y="556" style="letter-spacing:1px">NOTES</text>
  <text class="ts" x="1180" y="582">1.  General tolerances to ISO 2768-mK.</text>
  <text class="ts" x="1180" y="606">2.  Break sharp edges 0,5 × 45°, deburr and remove all swarf.</text>
  <text class="ts" x="1180" y="630">3.  Surface texture Ra 1,6 machined all over.</text>
  <text class="ts" x="1180" y="654">4.  Bore Ø50 H7 to be finish machined after heat treatment.</text>
  <text class="ts" x="1180" y="678">5.  Do not scale from this drawing.</text>
</g>

